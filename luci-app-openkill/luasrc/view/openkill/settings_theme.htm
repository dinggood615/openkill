<link rel="stylesheet" href="/luci-static/resources/openkill/css/flat.css?v=<%=plugin_version%>">
<script type="text/javascript">
(function() {
    var SEARCH_HINT = '<%:Search settings by name or description%>';
    var NO_MATCH = '<%:No matching settings%>';
    /* Stage 4 keeps category identity independent from tab order.  The
     * labels are only used to resolve the native CBI tab to a stable key;
     * field ownership below is always an explicit key list. */
    var CARD_LAYOUTS = {

            {id: 'lan-wan', title: '局域网设备访问控制', keys: [

                'lan_ac_white_ips', 'lan_ac_white_macs', 'lan_interface_name', 'intranet_allowed',

            {id: 'naiveproxy-service', title: 'NaiveProxy与服务', fullWidth: true, keys: [

            ]}
        ],
        rules: [
            {id: 'geo-databases', title: '<%:Geo Databases%>', fullWidth: true, keys: [

                'geo_custom_url', 'GEOIP Update', '更新 GeoIP',
                'geoip_auto_update', 'geoip_update_week_time', 'geoip_update_day_time',
                'geoip_custom_url', 'GEOIP Dat Update', '更新 GeoIP Dat',
                'geosite_auto_update', 'geosite_update_week_time', 'geosite_update_day_time',
                'geosite_custom_url', 'GEOSITE Update', '更新 GeoSite',
                'geoasn_auto_update', 'geoasn_update_week_time', 'geoasn_update_day_time',

            {id: 'china-routes', title: '<%:China Route Lists%>', fullWidth: true, keys: [

            ]}
        ],
        stability: [
            {id: 'watchdog-restart', title: '<%:Watchdog & Auto Restart%>', fullWidth: true, keys: [

                'health_profile', 'watchdog_interval', 'watchdog_network_cycles',

            ]}
        ],
        compatibility: [
            {id: 'vpn-policy', title: 'VPN 访问策略', keys: [

            ]},
            {id: 'remote-service', title: '远程访问绕过', keys: [
                'remote_service_bypass', 'rustdesk_compatibility', 'rustdesk_server_domains', 'remote_service_ports', 'wan_ac_black_ips',
                'wan_ac_black_ports', 'wan_interface_mode', 'wan_interface_name',
            ]},
            {id: 'openvpn-compatibility', title: 'OpenVPN 精确兼容', keys: [
                'openvpn_compatibility', 'openvpn_role', 'openvpn_transport_bypass',
                'openvpn_transport_protocol', 'openvpn_server_ports', 'openvpn_server_ips',
                'openvpn_server_domains', 'openvpn_client_ips', 'openvpn_tunnel_policy',
                'openvpn_real_ip', 'openvpn_adblock_exception', 'openvpn_dns_mode',
                '_openvpn_status_contract'
            ]},
            {id: 'zerotier', title: 'ZeroTier', keys: [
                'zerotier_status', 'feature_zerotier', 'zerotier_network_id',
                'zerotier_interface', 'zerotier_auto_start', 'zerotier_apply'
            ]},
        ],
        advanced: [
            {id: 'maintenance-tools', title: '系统维护', keys: [
                'version_update_panel', 'firewall_custom'
            ]},
            {id: 'mihomo-capabilities', title: '<%:Mihomo Capabilities%>', keys: [
                'capability_summary', 'refresh_capabilities', 'capability_policy'
            ]}
        ]
    };

    var TAB_CATEGORY_ALIASES = {
        basic: /运行与服务|运行和服务|Operation\s*&\s*Services|Runtime\s*&\s*Services/i,
        network: /网络与分流|Network\s*&\s*Routing/i,
        naive_service: /NaiveProxy与服务|NaiveProxy\s*&\s*Service/i,
        rules: /规则与订阅|Rules\s*&\s*Subscriptions/i,
        stability: /性能与稳定|Performance\s*&\s*Stability/i,
        compatibility: /兼容设置|兼容与辅助|Compatibility/i,
        advanced: /系统维护|System\s*Maintenance|Advanced/i
    };

    var DEVICE_COMPATIBILITY_KEYS = [
        'disable_quic_go_gso',
        'small_flash_memory'
    ];

    function addClass(el, name, enabled) {
        if (!el) return;
        el.classList.toggle(name, !!enabled);
    }

    function setSearchVisibility(element, visible) {
        if (!element) return;
        var shouldShow = !!visible;
        if (!shouldShow) {
            if (!element._ocSearchVisibility) {
                element._ocSearchVisibility = {
                    hidden: !!element.hidden,
                    ariaHidden: element.getAttribute('aria-hidden')
                };
            }
            addClass(element, 'openkill-search-hidden', true);
            element.hidden = true;
            element.setAttribute('aria-hidden', 'true');
            if (element.contains && document.activeElement &&
                element.contains(document.activeElement) && document.activeElement.blur) {
                document.activeElement.blur();
            }
            return;
        }
        addClass(element, 'openkill-search-hidden', false);
        var previous = element._ocSearchVisibility;
        if (previous) {
            element.hidden = previous.hidden;
            if (previous.ariaHidden === null) element.removeAttribute('aria-hidden');
            else element.setAttribute('aria-hidden', previous.ariaHidden);
            delete element._ocSearchVisibility;
        }
    }

    function setAdvancedTabVisibility(item, visible) {
        if (!item) return;
        var shouldShow = !!visible;
        item.hidden = !shouldShow;
        item.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
        if (!shouldShow && item.contains && document.activeElement &&
            item.contains(document.activeElement) && document.activeElement.blur) {
            document.activeElement.blur();
        }
    }

    function tabLabel(item) {
        var link = item && item.querySelector('a');
        return ((link && link.textContent) || (item && item.textContent) || '').trim();
    }

    function tabPanel(item) {
        var link = item && item.querySelector('a[href]');
        if (!link) return null;
        var href = link.getAttribute('href') || '';
        if (href.charAt(0) === '#' && href.length > 1) {
            return document.getElementById(href.substring(1));
        }
        /* LuCI 25.x uses href="#" and keeps the actual tab target in a
         * sibling container.openkill.config.<category> node. */
        var category = tabCategory(item);
        return category ? document.getElementById('container.openkill.config.' + category) : null;
    }

    function tabIsActive(item) {
        return item.classList.contains('cbi-tabmenu-tab-active') ||
            item.classList.contains('active') || item.classList.contains('selected');
    }

    function fieldSearchText(field) {
        var text = field.textContent || '';
        var controls = field.querySelectorAll('input, select, textarea, button');
        for (var i = 0; i < controls.length; i++) {
            text += ' ' + (controls[i].name || '') + ' ' +
                (controls[i].id || '') + ' ' + (controls[i].placeholder || '') + ' ' +
                (controls[i].getAttribute('data-name') || '') + ' ' +
                (controls[i].getAttribute('aria-label') || '');
        }
        return text.toLowerCase();
    }

    function addFieldKey(keys, value) {
        value = String(value || '').trim();
        if (!value) return;
        keys[value] = true;
        keys[value.toLowerCase()] = true;
        var match = value.match(/(?:cbid\.openkill\.config\.|cbi-openkill-config-)(.+)$/i);
        if (match && match[1]) {
            keys[match[1]] = true;
            keys[match[1].toLowerCase()] = true;
        }
        var last = value.match(/\.([^\.]+)$/);
        if (last && last[1]) {
            keys[last[1]] = true;
            keys[last[1].toLowerCase()] = true;
        }
    }

    function fieldKeys(field) {
        var keys = {};
        var controls = field.querySelectorAll('input, select, textarea, button');
        for (var i = 0; i < controls.length; i++) {
            addFieldKey(keys, controls[i].name);
            addFieldKey(keys, controls[i].id);
            addFieldKey(keys, controls[i].getAttribute('data-name'));
        }
        addFieldKey(keys, field.id);
        addFieldKey(keys, field.getAttribute('data-name'));
        addFieldKey(keys, field.getAttribute('data-option'));
        return keys;
    }

    function matchesKeys(field, keys) {
        var available = fieldKeys(field);
        for (var i = 0; i < keys.length; i++) {
            var key = String(keys[i]);
            if (available[key] || available[key.toLowerCase()]) return true;
        }
        return false;
    }

    function tabCategory(item) {
        var label = tabLabel(item);
        for (var key in TAB_CATEGORY_ALIASES) {
            if (TAB_CATEGORY_ALIASES[key].test(label)) return key;
        }
        return null;
    }

    function panelContent(panel) {
        return panel.querySelector('.cbi-section-node') ||
            panel.querySelector('.cbi-tabcontainer') || panel;
    }

    function directFields(content) {
        var fields = Array.prototype.filter.call(content.querySelectorAll('.cbi-value'), function(field) {
            return field.parentNode === content;
        });
        if (fields.length) return fields;
        return Array.prototype.filter.call(content.querySelectorAll('.cbi-value'), function(field) {
            return !field.closest('.openkill-settings-card');
        });
    }

    function setCardExpanded(card, expanded) {
        var body = card.querySelector('.openkill-settings-card-body');
        var toggle = card.querySelector('.openkill-settings-card-toggle');
        if (!body || !toggle) return;
        var isExpanded = !!expanded;
        card.classList.toggle('is-collapsed', !isExpanded);
        body.hidden = !isExpanded;
        body.setAttribute('aria-hidden', isExpanded ? 'false' : 'true');
        toggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
        if (!isExpanded && body.contains && document.activeElement &&
            body.contains(document.activeElement) && document.activeElement.blur) {
            document.activeElement.blur();
        }
    }

    function createCard(content, definition, fields, index, host) {
        fields = fields || [];
        if (!fields.length && !definition.keepEmpty) return null;
        var card = document.createElement('section');
        card.className = 'openkill-settings-card';
        card.setAttribute('data-openkill-card', definition.id);
        if (definition.advanced) card.classList.add('openkill-settings-card-advanced');
        /* Full-width is a layout decision made by the category definition.
         * A field such as an allowlist can span its card body without forcing
         * the whole card onto a separate grid row. */
        if (definition.fullWidth) {
            card.classList.add('openkill-settings-card-full-width');
        }

        var header = document.createElement('div');
        header.className = 'openkill-settings-card-header';
        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'openkill-settings-card-toggle';
        toggle.setAttribute('aria-controls', 'openkill-settings-card-body-' + index);
        var title = document.createElement('span');
        title.className = 'openkill-settings-card-title';
        title.textContent = definition.title;
        var count = document.createElement('span');
        count.className = 'openkill-settings-card-count';
        count.textContent = String(fields.length);
        var marker = document.createElement('span');
        marker.className = 'openkill-settings-card-marker';
        marker.setAttribute('aria-hidden', 'true');
        marker.textContent = '⌄';
        toggle.appendChild(title);
        toggle.appendChild(count);
        toggle.appendChild(marker);
        header.appendChild(toggle);

        var body = document.createElement('div');
        body.className = 'openkill-settings-card-body';
        body.id = 'openkill-settings-card-body-' + index;
        fields.forEach(function(field) { body.appendChild(field); });
        card.appendChild(header);
        card.appendChild(body);
        if (host) host.appendChild(card);
        else content.appendChild(card);

        if (definition.id !== 'maintenance-tools') {
            toggle.addEventListener('click', function() {
                setCardExpanded(card, card.classList.contains('is-collapsed'));
            });
        } else {
            toggle.setAttribute('aria-expanded', 'true');
            toggle.setAttribute('aria-disabled', 'true');
            toggle.classList.add('openkill-settings-card-toggle-static');
            marker.hidden = true;
        }
        setCardExpanded(card, true);
        return card;
    }

    /* Move the original CBI rows once, before any category is cardified.  The
     * controls remain single-instance and keep their original id/name, while
     * the compatibility tab owns their presentation card. */
    function moveExplicitFieldsToCategory(map, tabItems, targetCategory, keys) {
        var targetPanel = null;
        for (var i = 0; i < tabItems.length; i++) {
            if (tabCategory(tabItems[i]) === targetCategory) {
                targetPanel = tabPanel(tabItems[i]);
                break;
            }
        }
        if (!targetPanel) return;
        var destination = panelContent(targetPanel);
        if (!destination) return;
        var fields = map.querySelectorAll('.cbi-value');
        for (var j = 0; j < fields.length; j++) {
            var field = fields[j];
            if (field.closest('.openkill-settings-card')) continue;
            if (!matchesKeys(field, keys)) continue;
            field.classList.add('openkill-device-compatibility-field');
            if (field.parentNode !== destination) destination.appendChild(field);
        }
    }

    function validationSelector() {
        return '.cbi-value-error, .cbi-error, .cbi-input-invalid, [aria-invalid="true"]';
    }

    function expandValidationErrors(root) {
        if (!root) return;
        var invalid = root.querySelectorAll(validationSelector());
        for (var i = 0; i < invalid.length; i++) {
            var card = invalid[i].closest('.openkill-settings-card');
            if (card) {
                card.classList.add('openkill-settings-card-validation-error');
                setCardExpanded(card, true);
            }
        }
    }

    function isSourceTrafficSection(section) {
        if (!section) return false;
        var id = String(section.id || '').toLowerCase();
        var sectionType = String(section.getAttribute('data-section-type') || '').toLowerCase();
        /* The CBI id is stable across LuCI themes.  Prefer it over visible
         * translated headings so a theme or language change cannot detach
         * the rule editor from its owning card. */
        if (id === 'cbi-openkill-lan_ac_traffic' ||
            id.indexOf('cbi-openkill-lan_ac_traffic-') === 0 ||
            id.indexOf('lan_ac_traffic') !== -1 || sectionType === 'lan_ac_traffic') return true;
        var title = section.querySelector('.cbi-section-title, .cbi-section-descr, h3, legend');
        var text = title ? (title.textContent || '') : '';
        return /来源流量规则|来源流量访问控制|lan traffic access list/i.test(text);
    }

    function findNetworkPanel(map, tabItems) {
        for (var i = 0; i < tabItems.length; i++) {
            if (tabCategory(tabItems[i]) === 'network') {
                var panel = tabPanel(tabItems[i]);
                if (panel) return panel;
            }
        }
        /* Some LuCI themes render hidden tab panels after the initial pass or
         * omit the tab link href.  The generated id is stable and is safer
         * than searching by a translated heading. */
        return document.getElementById('container.openkill.config.network') ||
            map.querySelector('[id="container.openkill.config.network"]');
    }

    function keepSourceTrafficInNetwork(map, tabItems) {
        var networkPanel = findNetworkPanel(map, tabItems);
        if (!networkPanel) return;

        var sections = [];
        var candidates = map.querySelectorAll('.cbi-section, [id*="lan_ac_traffic"]');
        for (var j = 0; j < candidates.length; j++) {
            if (isSourceTrafficSection(candidates[j]) && sections.indexOf(candidates[j]) === -1) {
                sections.push(candidates[j]);
            }
        }
        if (!sections.length) return;

        var target = sections[0];
        /* The source rule editor belongs to Traffic Routing, not to the
         * network tab's anonymous root.  Resolve the generated card after
         * cardification and move the original CBI section into that card
         * body.  The section is moved, never cloned, so LuCI keeps its
         * existing names, ids, validation and submit hooks. */
        var trafficCard = networkPanel.querySelector('[data-openkill-card="traffic-routing"]');
        /* The first paint may happen before the hidden network panel has been
         * cardified.  Do not move the section to an anonymous root in that
         * case; a later bounded retry will resolve the real card. */
        if (!trafficCard) return;
        var destination = trafficCard && trafficCard.querySelector('.openkill-settings-card-body');
        /* A forced traffic card is created even when all of its ordinary
         * fields are hidden by a device-specific dependency.  Never fall
         * back to the tab root: that was the reason the source-rule table
         * appeared as a separate wide section in some LuCI renders. */
        if (!destination) return;
        if (target.parentNode !== destination) destination.appendChild(target);
        target.classList.add('openkill-network-only-section');
        target.setAttribute('data-openkill-network-card', 'source-traffic');
        target.setAttribute('data-openkill-traffic-card', 'source-traffic');
        target.setAttribute('data-openkill-section-kind', 'source-traffic');
        target.hidden = false;
        target.removeAttribute('aria-hidden');

        var ruleRows = target.querySelectorAll('tr.cbi-section-table-row:not(.placeholder)');
        /* Resolve labels from the actual control name.  Positional labels are
         * unsafe when a LuCI theme omits an optional column. */
        var sourceLabels = {
            comment: '备注', enabled: '启用', src_ip: '来源地址',
            src_port: '来源端口', proto: '协议', family: '地址族',
            interface: '接口', user: '来源用户', dscp: 'DSCP', target: '处理对象'
        };
        var headings = target.querySelectorAll('.cbi-section-table-titles th');
        for (var r = 0; r < ruleRows.length; r++) {
            ruleRows[r].classList.add('openkill-source-rule-card');
            ruleRows[r].setAttribute('data-openkill-rule-card', '1');
            var cells = ruleRows[r].children || [];
            for (var c = 0; c < cells.length; c++) {
                var cell = cells[c];
                if (c === 0 && !cell.querySelector('input, select, textarea, .cbi-dropdown')) {
                    cell.setAttribute('data-source-role', 'serial');
                    continue;
                }
                var control = cell.querySelector('input[name], select[name], textarea[name], [data-name]');
                var controlName = control && (control.name || control.getAttribute('data-name') || '');
                var optionName = String(controlName).split('.').pop();
                var label = sourceLabels[optionName];
                if (!label && headings[c]) label = (headings[c].textContent || '').replace(/\s+/g, ' ').trim();
                if (label) cell.setAttribute('data-source-label', label);
                else if (cell.querySelector('button, input[type="button"], input[type="submit"]')) {
                    cell.setAttribute('data-source-role', 'action');
                    cell.setAttribute('data-source-label', '操作');
                }
            }
        }

        for (var k = 1; k < sections.length; k++) {
            sections[k].hidden = true;
            sections[k].setAttribute('aria-hidden', 'true');
        }
    }

    function retrySourceTrafficMount(map, tabItems) {
        /* Build all category cards first, then move the original TypedSection
         * into its stable traffic card.  The retries are bounded and
         * idempotent; they only change DOM presentation and never submit or
         * rewrite a UCI value. */
        buildCards(tabItems, false);
        keepSourceTrafficInNetwork(map, tabItems);
    }

    function buildCards(tabItems, activeOnly) {
        /* The six logical tabs share one stable layout; version updates are
         * rendered as the first maintenance card instead of a top-level tab. */
        tabItems.forEach(function(item, tabIndex) {
            var panel = tabPanel(item);
            if (!panel) return;
            var category = tabCategory(item);
            var layout = category ? CARD_LAYOUTS[category] : null;
            if (activeOnly && !tabIsActive(item)) return;
            if (!layout || panel.getAttribute('data-openkill-cards-ready') === '1') return;
            var content = panelContent(panel);
            var fields = directFields(content);
            var hasForcedCard = layout.some(function(definition) { return !!definition.keepEmpty; });
            if (!fields.length && !hasForcedCard) return;
            panel.setAttribute('data-openkill-cards-ready', '1');
            var stack = document.createElement('div');
            stack.className = 'openkill-settings-card-stack';
            /* keepEmpty cards may be rendered with no direct CBI fields when
             * dependencies hide every option.  Append the stack in that case
             * instead of dereferencing a missing first field. */
            if (fields.length && fields[0].parentNode === content) content.insertBefore(stack, fields[0]);
            else content.appendChild(stack);
            var remaining = fields.slice();
            var cardIndex = 0;
            layout.forEach(function(definition) {
                var selected = remaining.filter(function(field) {
                    return matchesKeys(field, definition.keys);
                });
                if (!selected.length) return;
                selected.forEach(function(field) {
                    var position = remaining.indexOf(field);
                    if (position !== -1) remaining.splice(position, 1);
                });
                createCard(content, definition, selected, tabIndex + '-' + cardIndex++, stack);
            });
            if (remaining.length) {
                createCard(content, {
                    id: 'other-' + (category || tabIndex),
                    title: '<%:Other Settings%>',
                    keys: []
                }, remaining, tabIndex + '-other', stack);
            }
            expandValidationErrors(panel);
        });
    }

    function initOpenKillSettingsTheme() {
        var map = document.getElementById('cbi-openkill');
        if (!map) return;
        if (map.getAttribute('data-openkill-ui-ready') === '1') return;
        map.setAttribute('data-openkill-ui-ready', '1');
        map.classList.add('openkill-settings');
        document.body.classList.add('openkill-settings-page');
        /* LuCI 24/25 uses cbi-section-node-tabbed; keep the older class as
         * a compatibility fallback for older Argon/LuCI installations. */
        var tabs = map.querySelector('.cbi-section-tabbed, .cbi-section-node-tabbed');
        if (!tabs) return;
        tabs.classList.add('openkill-settings-tabs');

        /* Newer LuCI renders the tab list beside the tabbed section node;
         * older releases nest it below the wrapper.  Keep both layouts. */
        var menu = tabs.querySelector('ul.cbi-tabmenu') ||
            tabs.querySelector('.cbi-tabmenu') ||
            map.querySelector('ul.cbi-tabmenu') ||
            map.querySelector('.cbi-tabmenu');
        if (!menu) return;

        var toolbar = document.createElement('div');
        toolbar.className = 'openkill-settings-toolbar';
        toolbar.setAttribute('role', 'search');

        var searchWrap = document.createElement('label');
        searchWrap.className = 'openkill-settings-search';
        var searchIcon = document.createElement('span');
        searchIcon.className = 'openkill-settings-search-icon';
        searchIcon.textContent = '⌕';
        var input = document.createElement('input');
        input.type = 'search';
        input.id = 'openkill-settings-search';
        input.placeholder = SEARCH_HINT;
        input.setAttribute('aria-label', SEARCH_HINT);
        var clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'openkill-settings-search-clear';
        clear.textContent = '×';
        clear.title = '<%:Clear search%>';
        clear.setAttribute('aria-label', '<%:Clear search%>');
        searchWrap.appendChild(searchIcon);
        searchWrap.appendChild(input);
        searchWrap.appendChild(clear);

        var status = document.createElement('span');
        status.className = 'openkill-settings-search-status';
        status.setAttribute('aria-live', 'polite');

        toolbar.appendChild(searchWrap);
        toolbar.appendChild(status);
        menu.parentNode.insertBefore(toolbar, menu);

        var tabItems = [];
        for (var i = 0; i < menu.children.length; i++) {
            if (menu.children[i].tagName && menu.children[i].tagName.toLowerCase() === 'li') {
                tabItems.push(menu.children[i]);
            }
        }

        /* The legacy /naive bookmark redirects here with a stable query/hash.
         * Resolve it through the real LuCI tab link instead of duplicating a
         * second editor or relying on an implementation-specific panel id. */
        var requestedCategory = null;
        var queryMatch = String(window.location.search || '').match(/[?&]tab=([^&#]+)/i);
        if (queryMatch && queryMatch[1]) {
            try { requestedCategory = decodeURIComponent(queryMatch[1]); } catch (ignoreQuery) {}
        }
        if (!requestedCategory) {
            var requestedHash = String(window.location.hash || '').toLowerCase();
            if (requestedHash.indexOf('#openkill-naive-component-info') === 0)
                requestedCategory = 'naive_service';
            else if (requestedHash === '#compatibility') requestedCategory = 'compatibility';
        }
        if (requestedCategory) {
            requestedCategory = requestedCategory.toLowerCase();
            for (var requestedIndex = 0; requestedIndex < tabItems.length; requestedIndex++) {
                if (tabCategory(tabItems[requestedIndex]) !== requestedCategory) continue;
                var requestedLink = tabItems[requestedIndex].querySelector('a');
                if (requestedLink && !tabIsActive(tabItems[requestedIndex])) requestedLink.click();
                break;
            }
        }
        moveExplicitFieldsToCategory(map, tabItems, 'compatibility', DEVICE_COMPATIBILITY_KEYS);
        /* LuCI versions which render a DummyValue template below the tab
         * section leave it outside directFields().  Move the original row
         * before card construction so the independent service is a peer of
         * VPN, remote access and OpenVPN instead of a full-width orphan. */
        moveExplicitFieldsToCategory(map, tabItems, 'naive_service', ['_naive_component_info']);
        // Build only the visible category before the first paint.  The CBI
        // fields remain in their original panels until their tab is needed,
        // so a slow router does not synchronously rearrange every advanced
        // option on page load.
        buildCards(tabItems, true);
        keepSourceTrafficInNetwork(map, tabItems);
        var deferCards = function() {
            buildCards(tabItems, false);
            keepSourceTrafficInNetwork(map, tabItems);
            var deferredErrors = map.querySelectorAll(validationSelector());
            if (deferredErrors.length && advancedItems.some(function(item) {
                return item.querySelector(validationSelector());
            })) setAdvancedVisible(true);
            expandValidationErrors(map);
        };
        if (typeof window.requestIdleCallback === 'function') {
            window.requestIdleCallback(deferCards, { timeout: 900 });
        } else {
            window.setTimeout(deferCards, 120);
        }
        /* Hidden CBI panels can be inserted after the first idle callback on
         * slower LuCI builds.  Give the renderer two short, bounded chances
         * to mount the source-rule section; never use an unbounded observer. */
        window.setTimeout(function() { retrySourceTrafficMount(map, tabItems); }, 260);
        window.setTimeout(function() { retrySourceTrafficMount(map, tabItems); }, 900);

        var advancedItems = tabItems.filter(function(item) {
            return /(高级|系统|advanced|maintenance)/i.test(tabLabel(item));
        });
        advancedItems.forEach(function(item) {
            item.classList.add('openkill-advanced-tab');
        });
        function setAdvancedVisible(visible) {
            /* System Maintenance is part of the normal settings surface.  It
             * remains visible regardless of any value left in old browser
             * storage from the removed advanced-settings toggle. */
            visible = true;
            addClass(map, 'openkill-advanced-visible', true);
            addClass(map, 'openkill-advanced-collapsed', false);
            advancedItems.forEach(function(item) {
                setAdvancedTabVisibility(item, true);
            });
        }

        function updateSearch() {
            var query = (input.value || '').trim().toLowerCase();
            var total = 0;
            var firstMatch = null;
            tabItems.forEach(function(item) {
                var panel = tabPanel(item);
                if (!panel) return;
                var fields = panel.querySelectorAll('.cbi-value');
                var matched = 0;
                for (var j = 0; j < fields.length; j++) {
                    var found = !query || fieldSearchText(fields[j]).indexOf(query) !== -1;
                    setSearchVisibility(fields[j], found);
                    if (found && query) {
                        matched++;
                        if (!firstMatch) firstMatch = {item: item, field: fields[j]};
                        var matchCard = fields[j].closest('.openkill-settings-card');
                        if (matchCard) setCardExpanded(matchCard, true);
                    }
                }
                var cards = panel.querySelectorAll('.openkill-settings-card');
                for (var k = 0; k < cards.length; k++) {
                    var cardFields = cards[k].querySelectorAll('.cbi-value');
                    var cardMatch = !query;
                    for (var n = 0; n < cardFields.length; n++) {
                        if (!cardFields[n].classList.contains('openkill-search-hidden')) {
                            cardMatch = true;
                            break;
                        }
                    }
                    setSearchVisibility(cards[k], !query || cardMatch);
                }
                addClass(item, 'openkill-search-match', !!query && matched > 0);
                var anchor = item.querySelector('a');
                if (anchor) {
                    var badge = anchor.querySelector('.openkill-tab-match-count');
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'openkill-tab-match-count';
                        anchor.appendChild(badge);
                    }
                    badge.textContent = query && matched ? String(matched) : '';
                    badge.hidden = !(query && matched);
                }
                total += matched;
            });
            addClass(map, 'openkill-search-active', !!query);
            if (!query) {
                status.textContent = '';
                return;
            }
            status.textContent = total ? String(total) : NO_MATCH;
            if (!firstMatch) return;
            if (advancedItems.indexOf(firstMatch.item) !== -1) setAdvancedVisible(true);
            if (!tabIsActive(firstMatch.item)) {
                var firstLink = firstMatch.item.querySelector('a');
                if (firstLink) firstLink.click();
            }
        }

        input.addEventListener('input', updateSearch);
        clear.addEventListener('click', function() {
            input.value = '';
            input.focus();
            updateSearch();
        });
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && input.value) {
                input.value = '';
                updateSearch();
            }
        });
        setAdvancedVisible(true);
        if (map.querySelector(validationSelector())) {
            if (advancedItems.some(function(item) { return item.querySelector(validationSelector()); })) {
                setAdvancedVisible(true);
            }
            expandValidationErrors(map);
        }

        var form = map.closest('form');
        if (form) {
            form.addEventListener('invalid', function(event) {
                var field = event.target && event.target.closest('.cbi-value');
                var card = field && field.closest('.openkill-settings-card');
                if (card) {
                    card.classList.add('openkill-settings-card-validation-error');
                    setCardExpanded(card, true);
                }
            }, true);
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initOpenKillSettingsTheme);
    } else {
        initOpenKillSettingsTheme();
    }
})();
</script>
