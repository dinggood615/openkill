name: Check official Mihomo release assets

# OpenKill does not maintain a second Smart fork.  The installer downloads the
# stable Meta/Mihomo binary from MetaCubeX at install time, so this workflow is
# intentionally a small availability check instead of a long source build.
on:
  schedule:
    - cron: "20 2 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest stable Mihomo assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq >/dev/null
          api="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          json="$(mktemp)"
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            -H 'Accept: application/vnd.github+json' "$api" -o "$json"
          tag="$(jq -r '.tag_name // empty' "$json")"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid Mihomo release tag: $tag" >&2; exit 1 ;;
          esac
          echo "Latest official stable release: $tag"
          names="$(jq -r '.assets[]?.name // empty' "$json")"
          # These are the architectures supported by the OpenKill installer.
          # Accept either v1-suffixed or generic amd64/arm64 asset naming as
          # upstream changes its release matrix.
          for pattern in \
            '^mihomo-linux-amd64(-v1)?-.*\.gz$' \
            '^mihomo-linux-arm64(-v1)?-.*\.gz$' \
            '^mihomo-linux-armv7-.*\.gz$' \
            '^mihomo-linux-386-.*\.gz$'; do
            if ! printf '%s\n' "$names" | grep -Eq "$pattern"; then
              echo "Missing official asset matching $pattern" >&2
              exit 1
            fi
          done
          rm -f "$json"
