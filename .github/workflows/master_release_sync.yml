name: Validate OpenKill release metadata

# IPK and APK are published independently by their build jobs.  There is no
# generated core branch to synchronise; the installer retrieves the official
# stable Mihomo release directly.  This workflow therefore validates source
# metadata after a tagged release without copying or rewriting branches.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check source and release conventions
        uses: actions/checkout@v4
      - name: Validate repository
        shell: bash
        run: sh scripts/validate-openkill.sh
      - name: Verify official core API is reachable
        shell: bash
        run: |
          set -eu
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -q '"tag_name"'
