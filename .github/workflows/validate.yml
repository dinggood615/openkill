name: OpenKill Development CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate local and workflow gates
        shell: bash
        run: sh scripts/local-gate.sh
      - name: Local semantic and autonomy contracts
        shell: bash
        run: |
          set -eu
          for suite in autonomous-workflow classifier-contract dataplane-semantic-spec nft-ir shadow-context-adapter shadow-semantic-model dns-current-intent network-model snapshot-fw4 stage-d uci-lifecycle; do
            python3 "scripts/test-${suite}.py"
          done

  runtime:
    name: Runtime and compatibility matrix
    uses: ./.github/workflows/runtime-tests.yml
