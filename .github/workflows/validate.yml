name: OpenKill Development CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell, YAML and version metadata
        shell: bash
        run: sh scripts/validate-openkill.sh

  runtime:
    name: Runtime and compatibility matrix
    uses: ./.github/workflows/runtime-tests.yml
