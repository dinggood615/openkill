name: OpenKill Development CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate local and workflow gates
        shell: bash
        run: sh scripts/local-gate.sh
      - name: Install YAML fixture dependency
        run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml
      - name: Local semantic and autonomy contracts
        shell: bash
        run: |
          set -eu
          python3 scripts/verify_3e2_safe_config.py
          command -v node
          for suite in autonomous-workflow classifier-contract dataplane-semantic-spec nft-ir naiveproxy-integration naiveproxy-health shadow-context-adapter shadow-semantic-model shadow-production-typed shadow-sidecar-producer dns-current-intent network-model snapshot-fw4 stage-d uci-lifecycle 3e2-safe-config ui-contract ui-interactions ui-preview; do
            python3 "scripts/test-${suite}.py"
          done

  runtime:
    name: Runtime and compatibility matrix
    uses: ./.github/workflows/runtime-tests.yml
