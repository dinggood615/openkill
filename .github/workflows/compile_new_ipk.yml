name: Compile The New Version OpenKill

on: 
  push:
    branches:
      - master
    paths:
      - 'luci-app-openkill/**'
      - 'scripts/**'
      - '.github/workflows/compile_new_ipk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the already verified package to GitHub Releases and package branch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: openkill-package-release
  cancel-in-progress: false

jobs:
  Runtime-Tests:
    uses: ./.github/workflows/runtime-tests.yml
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: New Version
        id: version
        run: |
          version=$(grep 'PKG_VERSION:=' ./luci-app-openkill/Makefile | awk -F ':=' '{print $2}' | tr -d '[:space:]')
          project=$(grep '^PROJECT_VERSION=' ./scripts/install-openkill.sh | sed -E 's/.*="([^"]+)"/\1/' | tr -d '[:space:]')
          readme=$(grep -oE '当前版本：`[^`]+`' README.md | sed -E 's/.*`([^`]+)`.*/\1/' | head -n 1)
          [ -n "$version" ] || { echo 'PKG_VERSION is empty'; exit 1; }
          [ "$version" = "$project" ] || { echo "Version mismatch: Makefile=$version installer=$project"; exit 1; }
          [ "$version" = "$readme" ] || { echo "Version mismatch: Makefile=$version README=$readme"; exit 1; }
          case "$version" in *[!0-9-]*) echo "Invalid version: $version"; exit 1;; esac
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Current Version
        id: current_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          # Read only the version metadata, not the entire binary package branch.
          current_content=$(gh api "repos/$RELEASE_REPOSITORY/contents/master/version?ref=package" --jq '.content' 2>/dev/null || true)
          decoded_content=$(printf '%s' "$current_content" | base64 --decode 2>/dev/null || true)
          current=$(printf '%s\n' "$decoded_content" | sed -n '1s/^v//p' | tr -d '[:space:]')
          if ! [[ "$current" =~ ^2026-[0-9]+$ ]]; then
            # The package channel may be intentionally empty before the first
            # locally verified release. Treat it as version zero.
            current=2026-0000
          fi
          echo "version=$current" >> $GITHUB_OUTPUT

      - name: Require Version Bump
        if: ${{ steps.version.outputs.version == steps.current_version.outputs.version && github.event_name != 'workflow_dispatch' }}
        run: |
          echo "::error::Source changes require a version bump. Update PKG_VERSION and PROJECT_VERSION before publishing."
          exit 1

  Compile:
    runs-on: ubuntu-latest
    needs: [Get-Version, Runtime-Tests]
    if: ${{ needs.Get-Version.outputs.version != needs.Get-Version.outputs.current_version || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          # 当前目标固件使用 opkg，仅构建兼容性更好的 IPK。
          - { name: ipk, sdk_url: "https://mirrors.pku.edu.cn/openwrt/releases/22.03.0/targets/x86/64/openwrt-sdk-22.03.0-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz", sdk_tar: "SDK.tar.xz", sdk_backup_tar: "SDK.tar.bz2", sdk_dir: "SDK", artifact_pattern: "luci-app-openkill_*.ipk" }
          # APK 使用 OpenWrt snapshot SDK，供 apk 包管理器固件使用。
          - { name: apk, sdk_url: "https://downloads.openwrt.org/snapshots/targets/x86/64/", sdk_tar: "SNAPSDK.tar.zst", sdk_backup_tar: "SNAPSDK.tar.zst", sdk_dir: "SDK", artifact_pattern: "luci-app-openkill*.apk" }
    steps:
      - name: Checkout OpenKill Source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar unzip zstd jq python3 python3-pyelftools python3-setuptools

      - name: Download SDK
        run: |
          mkdir -p tmp
          if [ "${{ matrix.target.name }}" = "ipk" ]; then
            if ! curl -SLfk --connect-timeout 30 --retry 2 "${{ matrix.target.sdk_url }}" -o "./tmp/${{ matrix.target.sdk_tar }}"; then
              curl -SLf --connect-timeout 30 --retry 2 "https://downloads.openwrt.org/releases/22.03.0/targets/x86/64/openwrt-sdk-22.03.0-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz" -o "./tmp/${{ matrix.target.sdk_tar }}"
              cd tmp
              tar xf ${{ matrix.target.sdk_tar }}
              mv openwrt-sdk-* ${{ matrix.target.sdk_dir }}
            else
              cd tmp
              tar xf ${{ matrix.target.sdk_tar }}
              mv openwrt-sdk-* ${{ matrix.target.sdk_dir }}
            fi
          else
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
            SDK_NAME=$(curl -sf $BASE_URL | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
            [ -n "$SDK_NAME" ] || { echo 'OpenWrt snapshot SDK was not listed'; exit 1; }
            if ! curl -SLfk --connect-timeout 30 --retry 2 "$BASE_URL/$SDK_NAME" -o "./tmp/${{ matrix.target.sdk_tar }}"; then
              BASE_URL2="https://mirrors.pku.edu.cn/files/openwrt/snapshots/targets/x86/64/"
              SDK_NAME=$(curl -sf $BASE_URL2 | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
              [ -n "$SDK_NAME" ] || { echo 'Fallback OpenWrt snapshot SDK was not listed'; exit 1; }
              curl -SLfk --connect-timeout 30 --retry 2 "$BASE_URL2/$SDK_NAME" -o "./tmp/${{ matrix.target.sdk_tar }}"
            fi
            cd tmp
            zstd -d ${{ matrix.target.sdk_tar }} -o SNAPSDK.tar
            tar xf SNAPSDK.tar
            SDK_DIR=$(tar tf SNAPSDK.tar | head -n 1 | cut -d/ -f1)
            mv "$SDK_DIR" "${{ matrix.target.sdk_dir }}"
          fi

      - name: Copy OpenKill Source Codes
        run: |
          mkdir -p tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill
          cp -rf ./luci-app-openkill/. tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/
          if [ "${{ matrix.target.name }}" = "apk" ]; then
            # apk accepts dotted numeric versions, not the project's date-counter separator.
            sed -i 's/^PKG_VERSION:=2026-/PKG_VERSION:=2026./' tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/Makefile
            find tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill -type f -name "Makefile" -exec sed -i 's/DEPENDS:=+dnsmasq-full/DEPENDS:=+dnsmasq-full +luci-compat/g' {} \;
          fi

      - name: Update Third-Party Resources
        run: |
          set -euo pipefail
          download() {
            url="$1"
            out="$2"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --connect-timeout 15 --max-time 180 "$url" -o "$out"
          }
          CHNR_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/root/etc/openkill/china_ip_route.ipset
          CHNR6_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/root/etc/openkill/china_ip6_route.ipset
          ZASHBOARD_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/root/usr/share/openkill/ui/zashboard
          METACUBEXD_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/root/usr/share/openkill/ui/metacubexd
          GEOSITE_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/root/etc/openkill/GeoSite.dat
          COUNTRY_MMDB_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/root/etc/openkill/Country.mmdb

          # 更新 China IP Route
          mkdir -p tmp
          download https://ispip.clang.cn/all_cn.txt tmp/china_ip_route.ipset
          mkdir -p $(dirname $CHNR_PATH)
          cp tmp/china_ip_route.ipset $CHNR_PATH
          download https://ispip.clang.cn/all_cn_ipv6.txt tmp/china_ip6_route.ipset
          mkdir -p $(dirname $CHNR6_PATH)
          cp tmp/china_ip6_route.ipset $CHNR6_PATH

          # 更新 MetaCubeXD UI
          mkdir -p tmp/metacubexd_zip
          download https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip tmp/metacubexd.zip
          unzip -q -o tmp/metacubexd.zip -d tmp/metacubexd_zip
          METACUBEXD_UNZIP_PATH="tmp/metacubexd_zip/metacubexd-gh-pages"
          mkdir -p "$METACUBEXD_PATH"
          rm -rf "$METACUBEXD_PATH"/*
          cp -rf "$METACUBEXD_UNZIP_PATH"/* "$METACUBEXD_PATH"

          # 更新 ZashBoard UI
          mkdir -p tmp/zashboard_zip
          download https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip tmp/zashboard.zip
          unzip -q -o tmp/zashboard.zip -d tmp/zashboard_zip
          mkdir -p "$ZASHBOARD_PATH"
          rm -rf "$ZASHBOARD_PATH"/*
          cp -rf tmp/zashboard_zip/dist/* "$ZASHBOARD_PATH"

          # 提取国旗字体
          FONTS_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/root/www/luci-static/resources/openkill/fonts
          mkdir -p "$FONTS_PATH"
          TWEMOJI_FONT=$(ls tmp/zashboard_zip/dist/assets/TwemojiMozilla-flags-*.woff2 2>/dev/null | head -1)
          if [ -n "$TWEMOJI_FONT" ]; then
            cp "$TWEMOJI_FONT" "$FONTS_PATH/TwemojiMozilla-flags.woff2"
          fi

          # 更新 GeoSite.dat
          RULES_RELEASE=$(curl --fail --silent --show-error --retry 4 --retry-all-errors \
            https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest | jq -r '.tag_name')
          [ -n "$RULES_RELEASE" ] && [ "$RULES_RELEASE" != "null" ]
          download "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${RULES_RELEASE}/geosite.dat" tmp/GeoSite.dat
          mkdir -p $(dirname "$GEOSITE_PATH")
          cp tmp/GeoSite.dat "$GEOSITE_PATH"

          # 更新 Country.mmdb
          download "https://github.com/alecthw/mmdb_china_ip_list/releases/latest/download/Country-lite.mmdb" tmp/Country.mmdb
          mkdir -p $(dirname "$COUNTRY_MMDB_PATH")
          cp tmp/Country.mmdb "$COUNTRY_MMDB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: luci-app-openkill/tools/codemirror/package.json

      - name: Build CodeMirror 6 Bundle & Minify CSS/JS
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/tools/codemirror
          # Install dependencies
          npm install --prefer-offline --no-audit --no-fund
          # Build CodeMirror 6 JS
          npx esbuild entry.js --bundle --format=iife --global-name=CM6 --minify --target=es2019 --outfile=../../root/www/luci-static/resources/openkill/js/cm6.min.js --legal-comments=none --loader:.css=text
          # Minify other JS files (exclude cm6.min.js which is already built)
          JS_DIR="../../root/www/luci-static/resources/openkill/js"
          for js in "$JS_DIR"/*.js; do
            [ -f "$js" ] || continue
            [ "$(basename "$js")" = "cm6.min.js" ] && continue
            SIZE_BEFORE_JS=$(wc -c < "$js")
            npx esbuild "$js" --minify --target=es2019 --outfile="$js.tmp"
            mv "$js.tmp" "$js"
            SIZE_AFTER_JS=$(wc -c < "$js")
            echo "$(basename "$js") minified: ${SIZE_BEFORE_JS} -> ${SIZE_AFTER_JS} bytes ($(( 100 - SIZE_AFTER_JS * 100 / SIZE_BEFORE_JS ))% reduction)"
          done
          # Minify CSS
          CSS_PATH="../../root/www/luci-static/resources/openkill/css/oc.css"
          SIZE_BEFORE=$(wc -c < "$CSS_PATH")
          npx lightningcss --minify --targets 'iOS >= 12, safari >= 12, android >= 4.4' "$CSS_PATH" -o "$CSS_PATH.tmp"
          mv "$CSS_PATH.tmp" "$CSS_PATH"
          SIZE_AFTER=$(wc -c < "$CSS_PATH")
          echo "CSS minified: ${SIZE_BEFORE} -> ${SIZE_AFTER} bytes ($(( 100 - SIZE_AFTER * 100 / SIZE_BEFORE ))% reduction)"
          rm -rf node_modules

      - name: Compile po2lmo
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openkill/tools/po2lmo
          make && sudo make install

      - name: Compile OpenKill
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          if [ -f ../${{ matrix.target.sdk_tar }} ]; then
            make defconfig
          fi
          make package/luci-app-openkill/compile V=99
          if [ ! -f bin/packages/x86_64/base/${{ matrix.target.artifact_pattern }} ]; then
            mkdir -p bin/packages/x86_64/base
            find bin -name "luci-app-openkill_*.ipk" -exec cp {} bin/packages/x86_64/base/ \; 2>/dev/null || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkill-${{ matrix.target.name }}
          path: tmp/${{ matrix.target.sdk_dir }}/bin/packages/x86_64/base/${{ matrix.target.artifact_pattern }}

          if-no-files-found: error

      - name: Publish this package format independently
        # Every version bump from master is a release candidate that has passed
        # the compatibility matrix above.  Publish each format independently so
        # the installer never sees a newer source tree with a stale package
        # manifest.  Manual dispatch remains available for republishing.
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.Get-Version.outputs.version }}
          PACKAGE_FORMAT: ${{ matrix.target.name }}
        run: bash scripts/publish-package.sh
